<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sargam</title>
<meta name="description" content="A free music player for independent and Creative Commons music, with offline downloads.">
<meta name="theme-color" content="#0e1322">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sargam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app. Content scrolls, a dock (mini player + tabs) sits at the bottom, the full player slides up as a sheet. */
:root{
  --bg:#f1f3f9; --surface:#ffffff; --surface2:#e6e9f3; --line:rgba(18,23,42,.1);
  --fg:#12172a; --mute:#5a6382; --accent:#c27408; --accent-ink:#ffffff; --good:#17855a;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ph:240;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1322;--surface:#161d33;--surface2:#1f2842;--line:rgba(255,255,255,.09);--fg:#eef0f7;--mute:#9aa3bd;--accent:#f0a93b;--accent-ink:#1b1306;--good:#5ad19a;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#offline{flex:none;background:var(--surface2);color:var(--mute);font-size:13px;text-align:center;padding:6px 16px}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 24px}
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line)}
.ic{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 0 12px}
.head h1{font:800 32px/1 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--mute);font-size:14px}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--mute);flex:none}
h2.sec{font:700 18px/1.2 var(--display);margin:22px 0 8px;letter-spacing:-.01em}

/* art */
.art{--h:240;position:relative;overflow:hidden;border-radius:8px;aspect-ratio:1;background:linear-gradient(135deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 50) 50% 24%))}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:8px 0;min-width:0;cursor:pointer}
.row .art{width:52px;flex:none}
.row .meta{flex:1;min-width:0}
.t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .t{color:var(--accent)}
.acts{display:flex;flex:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mute);position:relative}
.ib.on{color:var(--accent)}
.ib.done{color:var(--good)}
.ib.off{opacity:.35}
.ib .pct{font-size:11px;font-weight:700;color:var(--accent)}
.ib i.one{position:absolute;font-style:normal;font-size:9px;font-weight:700;top:8px;right:8px}

/* horizontal cards */
.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{width:128px;flex:none;text-align:left}
.card .art{width:128px;margin-bottom:6px}

/* search */
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:0 14px;height:46px;margin:4px 0 12px;border:1px solid var(--line)}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.sbox .ic{color:var(--mute);width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.empty{color:var(--mute);padding:28px 4px;text-align:center}
.empty b{display:block;color:var(--fg);font:700 17px var(--display);margin-bottom:4px}
.skel{height:52px;border-radius:8px;background:var(--surface);margin:12px 0;opacity:.7;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* library */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin:4px 0 8px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:500;color:var(--mute);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pl{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.pl .glyph{width:52px;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--mute)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:99px;padding:10px 18px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.inline{display:flex;gap:8px;margin:8px 0}
.inline input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:0}
.note{color:var(--mute);font-size:13px;margin:6px 0 10px}

/* dock */
#mini{position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--surface);cursor:pointer}
#mini .art{width:42px;flex:none}
#mini .meta{flex:1;min-width:0}
#mini .bar{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0}
.tabs{display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--mute)}
.tab.on{color:var(--accent)}

/* full player */
#player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,hsl(var(--ph) 40% 22%),hsl(var(--ph) 35% 9%) 70%);color:#f4f5fb;visibility:hidden}
#player.open{transform:none;visibility:visible}
.pwrap{width:100%;max-width:560px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) max(20px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-right,0px))}
.ptop{display:flex;align-items:center;justify-content:space-between;color:#d9dcec}
.ptop small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
#player .ib{color:#d9dcec}
#player .ib.on{color:var(--accent)}
.pcover{flex:1;min-height:0;display:grid;place-items:center;padding:12px 0}
.pcover .art{width:min(100%,46vh,360px);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ptitle{display:flex;align-items:center;gap:8px}
.ptitle .meta{flex:1;min-width:0}
.ptitle .t{font:800 22px/1.2 var(--display);white-space:normal;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ptitle .s{font-size:15px;color:#b9bed6}
.seekrow{margin:14px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent);height:24px;margin:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:#b9bed6;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.ctrls .ib{width:48px;height:48px}
.ctrls .ic{width:26px;height:26px}
.play{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play .ic{width:30px;height:30px}
.pacts{display:flex;justify-content:space-around}
.qlist{flex:1;min-height:0;overflow-y:auto;margin-top:8px}
.qlist .s{color:#b9bed6}
.qlist .row.now .t{color:var(--accent)}
#player .t{color:#f4f5fb}

/* sheets */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;visibility:hidden;transition:opacity .2s}
#backdrop.open{opacity:1;visibility:visible}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:720px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:82dvh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:18px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-right,0px));visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheet h3{font:800 20px var(--display);margin:0 0 8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.opt .ic{color:var(--mute)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="offline" hidden>You are offline. Your downloaded songs still play.</div>
  <main id="view"></main>
  <div class="dock">
    <div id="mini" data-a="open-player" hidden></div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" data-a="tab" data-tab="home"></button>
      <button class="tab" data-a="tab" data-tab="search"></button>
      <button class="tab" data-a="tab" data-tab="library"></button>
    </nav>
  </div>
</div>

<section id="player" aria-label="Now playing"><div class="pwrap" id="pbody"></div></section>
<div id="backdrop" data-a="close-sheet"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var APP='SARGAM';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var ICONS={
  play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',
  next:'<path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/>',prev:'<path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/>',
  heart:'<path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/>',
  download:'<path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/>',check:'<path d="M5 12l4 4 10-10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  shuffle:'<path d="M3 7h3c5 0 5 10 10 10h3m0 0l-3-3m3 3l-3 3M3 17h3c1.6 0 2.8-.8 3.8-2M14 9c.7-1 1.9-2 3-2h3m0 0l-3-3m3 3l-3 3"/>',
  repeat:'<path d="M4 11V9a3 3 0 0 1 3-3h12m0 0l-3-3m3 3l-3 3M20 13v2a3 3 0 0 1-3 3H5m0 0l3 3m-3-3l3-3"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h10"/>',down:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',
  home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',lib:'<path d="M5 4v16M10 4v16M15 6l4 14"/>',
  sliders:'<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/>',
  trash:'<path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  note:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
  next1:'<path d="M5 12h12m0 0l-4-4m4 4l-4 4"/>'
};
var FILLED={play:1,pause:1,next:1,prev:1};
function ic(n){return '<svg class="ic'+(FILLED[n]?' f':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}
function icHeart(on){return '<svg class="ic'+(on?' f':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS.heart+'</svg>'}

var S={
  tab:'home',q:'',results:[],home:[],homeErr:'',homeLoading:true,searching:false,searchErr:'',searched:false,dlOnly:false,
  settings:Object.assign({jamendoKey:'',source:'audius'},LS.get('sg.settings',{})),
  liked:LS.get('sg.liked',[]),playlists:LS.get('sg.playlists',[]),
  downloads:new Map(),dlProgress:{},reg:new Map(),
  queue:[],idx:-1,shuffle:false,repeat:'off',playing:false,showQueue:false,libTab:'liked',openPl:null,seeking:false,
  installEvt:null
};
S.liked.forEach(function(t){S.reg.set(t.key,t)});
S.playlists.forEach(function(p){p.tracks.forEach(function(t){S.reg.set(t.key,t)})});
var recent=function(){return LS.get('sg.recent',[])};

/* ---------- storage for offline songs ---------- */
var dbp;
function db(){
  if(!dbp)dbp=new Promise(function(res,rej){
    var r=indexedDB.open('sargam',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('meta',{keyPath:'key'});r.result.createObjectStore('blobs',{keyPath:'key'})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
  return dbp;
}
function idb(store,mode,fn){
  return db().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction(store,mode),rq=fn(t.objectStore(store));
    t.oncomplete=function(){res(rq?rq.result:undefined)};
    t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
  })});
}
function loadDownloads(){
  return idb('meta','readonly',function(s){return s.getAll()}).then(function(all){
    (all||[]).forEach(function(t){S.downloads.set(t.key,t);S.reg.set(t.key,t)});
  }).catch(function(){});
}

/* ---------- music sources ---------- */
function normAudius(t){
  var a=t.artwork||{};
  var url='https://api.audius.co/v1/tracks/'+t.id+'/stream?app_name='+APP;
  var access=t.access||{};
  return {key:'au:'+t.id,src:'Audius',title:t.title||'Untitled',artist:(t.user&&t.user.name)||'Unknown artist',
    art:a['480x480']||a['150x150']||'',dur:t.duration||0,streamUrl:url,dlUrl:url,
    canDownload:access.download!=null?!!access.download:!!t.is_downloadable};
}
function searchAudius(q){
  var u=q?'https://api.audius.co/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=30&app_name='+APP
         :'https://api.audius.co/v1/tracks/trending?limit=30&app_name='+APP;
  return fetch(u).then(function(r){if(!r.ok)throw new Error('Audius returned '+r.status);return r.json()}).then(function(j){
    return (j.data||[]).filter(function(t){return t.is_streamable!==false}).map(normAudius);
  });
}
function searchJamendo(q){
  var k=(S.settings.jamendoKey||'').trim();
  if(!k){
    if(S.settings.source==='jamendo')return Promise.reject(new Error('Add your free Jamendo client ID in Settings'));
    return Promise.resolve([]);
  }
  var u='https://api.jamendo.com/v3.0/tracks/?client_id='+encodeURIComponent(k)+'&format=json&limit=30&audioformat=mp32&audiodlformat=mp32&imagesize=500&include=musicinfo';
  u+=q?'&search='+encodeURIComponent(q):'&order=popularity_week';
  return fetch(u).then(function(r){if(!r.ok)throw new Error('Jamendo returned '+r.status);return r.json()}).then(function(j){
    return (j.results||[]).filter(function(t){return t.audio}).map(function(t){
      return {key:'jm:'+t.id,src:'Jamendo',title:t.name,artist:t.artist_name,art:t.image||'',dur:+t.duration||0,
        streamUrl:t.audio,dlUrl:t.audiodownload||t.audio,canDownload:!!t.audiodownload_allowed};
    });
  });
}
function runSearch(q){
  var src=S.settings.source,jobs=[];
  if(src!=='jamendo')jobs.push(searchAudius(q));
  if(src!=='audius')jobs.push(searchJamendo(q));
  return Promise.allSettled(jobs).then(function(rs){
    var ok=rs.filter(function(r){return r.status==='fulfilled'}).map(function(r){return r.value});
    if(!ok.length)throw rs[0].reason||new Error('Search failed');
    var out=[],max=Math.max.apply(null,ok.map(function(a){return a.length}));
    for(var i=0;i<max;i++)ok.forEach(function(a){if(a[i])out.push(a[i])});
    out.forEach(function(t){S.reg.set(t.key,t)});
    return out;
  });
}

/* ---------- helpers ---------- */
function hue(k){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%360;return h}
function art(t,cls){return '<div class="art '+(cls||'')+'" style="--h:'+hue(t.key)+'">'+(t.art?'<img src="'+esc(t.art)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>'}
function fmt(s){s=Math.max(0,Math.floor(s||0));var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function isLiked(k){return S.liked.some(function(t){return t.key===k})}
function cur(){return S.queue[S.idx]}
var toastT;
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show')},3200)}
function shown(){return S.dlOnly?S.results.filter(function(t){return t.canDownload}):S.results}
function getList(n){
  if(n==='home')return S.home;if(n==='results')return shown();if(n==='recent')return recent();
  if(n==='liked')return S.liked;if(n==='downloads')return Array.from(S.downloads.values());
  if(n.indexOf('pl:')===0){var p=S.playlists.find(function(x){return x.id===n.slice(3)});return p?p.tracks:[]}
  return [];
}
function saveLib(){LS.set('sg.liked',S.liked);LS.set('sg.playlists',S.playlists)}

/* ---------- views ---------- */
function dlBtn(t){
  if(S.downloads.has(t.key))return '<button class="ib done" data-a="dl" data-key="'+esc(t.key)+'" aria-label="Remove download">'+ic('check')+'</button>';
  if(S.dlProgress[t.key]!=null){var p=S.dlProgress[t.key];return '<button class="ib" data-a="dl" data-key="'+esc(t.key)+'" aria-label="Downloading"><span class="pct">'+(p>0?Math.round(p*100)+'%':'...')+'</span></button>'}
  return '<button class="ib'+(t.canDownload?'':' off')+'" data-a="dl" data-key="'+esc(t.key)+'" aria-label="Download for offline">'+ic('download')+'</button>';
}
function row(t,list,i){
  var c=cur(),now=c&&c.key===t.key;
  return '<div class="row'+(now?' now':'')+'" data-a="play" data-list="'+esc(list)+'" data-i="'+i+'" role="button" tabindex="0">'+art(t)+
    '<div class="meta"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.artist)+' · '+esc(t.src)+(t.dur?' · '+fmt(t.dur):'')+'</div></div>'+
    '<div class="acts"><button class="ib'+(isLiked(t.key)?' on':'')+'" data-a="like" data-key="'+esc(t.key)+'" aria-label="Like">'+icHeart(isLiked(t.key))+'</button>'+

var audio=new Audio();audio.preload='auto';
var objURL=null;
function playList(list,i){S.queue=list.slice();playAt(i)}
function playAt(i){
  var t=S.queue[i];if(!t)return;
  S.idx=i;S.playing=true;renderPlayer();refreshRows();
  if(objURL){URL.revokeObjectURL(objURL);objURL=null}
  var go=function(src){
    if(cur()!==t)return;
    audio.src=src;
    var p=audio.play();if(p&&p.catch)p.catch(function(){S.playing=false;renderPlayer();toast('Could not play this song. Check your connection.')});
  };
  if(S.downloads.has(t.key)){
    idb('blobs','readonly',function(s){return s.get(t.key)}).then(function(rec){
      if(rec&&rec.blob){objURL=URL.createObjectURL(rec.blob);go(objURL)}else go(t.streamUrl);
    }).catch(function(){go(t.streamUrl)});
  }else go(t.streamUrl);
  addRecent(t);setSession(t);
}
function addRecent(t){
  var r=recent().filter(function(x){return x.key!==t.key});r.unshift(t);LS.set('sg.recent',r.slice(0,20));
}
function next(auto){
  if(!S.queue.length)return;
  if(auto&&S.repeat==='one'){audio.currentTime=0;audio.play();return}
  var i;
  if(S.shuffle&&S.queue.length>1){do{i=Math.floor(Math.random()*S.queue.length)}while(i===S.idx)}
  else{
    i=S.idx+1;
    if(i>=S.queue.length){
      if(S.repeat==='all'||!auto)i=0;
      else{S.playing=false;renderPlayer();return}
    }
  }
  playAt(i);
}
function prev(){
  if(audio.currentTime>3){audio.currentTime=0;return}
  var i=S.idx-1;playAt(i<0?S.queue.length-1:i);
}
function toggle(){
  if(!cur())return;
  if(audio.paused){var p=audio.play();if(p&&p.catch)p.catch(function(){})}else audio.pause();
}
audio.addEventListener('play',function(){S.playing=true;renderPlayer()});
audio.addEventListener('pause',function(){S.playing=false;renderPlayer()});
audio.addEventListener('ended',function(){next(true)});
audio.addEventListener('error',function(){if(cur()&&audio.src){S.playing=false;renderPlayer();toast('This song would not load. Try another.')}});
audio.addEventListener('timeupdate',updateSeek);
audio.addEventListener('loadedmetadata',updateSeek);
function updateSeek(){
  var d=audio.duration||(cur()&&cur().dur)||0,c=audio.currentTime||0;
  var bar=$('#mini .bar');if(bar)bar.style.width=(d?Math.min(100,c/d*100):0)+'%';
  if(S.seeking)return;
  var sk=$('#seek');if(sk)sk.value=d?Math.round(c/d*1000):0;
  var a=$('#tcur'),b=$('#tdur');if(a)a.textContent=fmt(c);if(b)b.textContent=fmt(d);
}
function setSession(t){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.src,artwork:t.art?[{src:t.art,sizes:'512x512'}]:[]});
  }catch(e){}
}
if('mediaSession' in navigator){
  var ms=navigator.mediaSession;
  [['play',function(){toggle()}],['pause',function(){toggle()}],['previoustrack',prev],['nexttrack',function(){next(false)}],
   ['seekto',function(d){if(d.seekTime!=null)audio.currentTime=d.seekTime}]].forEach(function(x){try{ms.setActionHandler(x[0],x[1])}catch(e){}});
}

  if(S.showQueue){
    h+='<div class="qlist">'+S.queue.map(function(q,i){

    '<div class="seekrow"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div></div>'+
    '<div class="ctrls"><button class="ib'+(S.shuffle?' on':'')+'" data-a="shuffle" aria-label="Shuffle">'+ic('shuffle')+'</button>'+

    '<button class="play" data-a="toggle" aria-label="'+(S.playing?'Pause':'Play')+'">'+ic(S.playing?'pause':'play')+'</button>'+
    '<button class="ib" data-a="next" aria-label="Next">'+ic('next')+'</button>'+
    '<button class="ib'+(S.repeat!=='off'?' on':'')+'" data-a="repeat" aria-label="Repeat">'+ic('repeat')+(S.repeat==='one'?'<i class="one">1</i>':'')+'</button></div>'+
    '<div class="pacts">'+dlBtn(t)+'<button class="ib" data-a="add" data-key="'+esc(t.key)+'" aria-label="Add to playlist">'+ic('plus')+'</button></div>';

function refreshRows(){
  if(S.tab==='search'){var r=$('#results');if(r)r.innerHTML=resultsHTML()}

/* ---------- likes, downloads, playlists ---------- */
function toggleLike(k){
  var t=S.reg.get(k);if(!t)return;
  if(isLiked(k))S.liked=S.liked.filter(function(x){return x.key!==k});else S.liked.unshift(t);
  saveLib();refreshRows();renderPlayer();
}
function updateProgress(k){
  document.querySelectorAll('[data-a="dl"][data-key="'+k+'"] .pct').forEach(function(el){var p=S.dlProgress[k];el.textContent=p>0?Math.round(p*100)+'%':'...'});
}
function fetchBlob(urls,k){
  var u=urls.shift();
  return fetch(u).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var total=+r.headers.get('content-length')||0,type=r.headers.get('content-type')||'audio/mpeg';
    if(!r.body||!r.body.getReader)return r.blob();
    var rd=r.body.getReader(),chunks=[],got=0;
    return (function pump(){
      return rd.read().then(function(x){
        if(x.done)return new Blob(chunks,{type:type});
        chunks.push(x.value);got+=x.value.length;
        if(total){S.dlProgress[k]=got/total;updateProgress(k)}
        return pump();
      });
    })();
  }).catch(function(e){if(urls.length)return fetchBlob(urls,k);throw e});
}
function download(t){
  if(S.downloads.has(t.key)){
    idb('blobs','readwrite',function(s){return s.delete(t.key)}).then(function(){return idb('meta','readwrite',function(s){return s.delete(t.key)})}).then(function(){
      S.downloads.delete(t.key);toast('Removed from this phone');refreshRows();renderPlayer();
    });
    return;
  }
  if(S.dlProgress[t.key]!=null)return;
  if(!t.canDownload){toast('The artist has not allowed downloads for this song');return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  S.dlProgress[t.key]=0;refreshRows();renderPlayer();
  var urls=[t.dlUrl];if(t.streamUrl!==t.dlUrl)urls.push(t.streamUrl);
  fetchBlob(urls,t.key).then(function(blob){
    return idb('blobs','readwrite',function(s){return s.put({key:t.key,blob:blob})}).then(function(){
      return idb('meta','readwrite',function(s){return s.put(t)});
    });
  }).then(function(){S.downloads.set(t.key,t);toast('Saved for offline listening')})
  .catch(function(e){toast('Download failed. The host may block saving this song.')})
  .then(function(){delete S.dlProgress[t.key];refreshRows();renderPlayer()});
}
function createPlaylist(id){
  var el=$('#'+id),n=el&&el.value.trim();
  if(!n){toast('Type a name first');return null}
  var p={id:'p'+Date.now().toString(36),name:n,tracks:[]};
  S.playlists.push(p);saveLib();el.value='';return p;
}

/* ---------- search flow ---------- */
var searchTok=0,searchTimer;
function doSearch(q){
  S.q=q;
  if(!q.trim()){S.searched=false;S.searching=false;S.searchErr='';S.results=[];var r=$('#results');if(r)r.innerHTML=resultsHTML();return}
  var tok=++searchTok;S.searching=true;S.searchErr='';
  var r1=$('#results');if(r1)r1.innerHTML=resultsHTML();
  runSearch(q.trim()).then(function(l){if(tok!==searchTok)return;S.results=l;S.searched=true;S.searching=false})
  .catch(function(e){if(tok!==searchTok)return;S.searching=false;S.searched=true;S.results=[];S.searchErr=navigator.onLine?(e.message||'Try again in a moment.'):'You are offline.'})
  .then(function(){if(tok!==searchTok)return;var r=$('#results');if(r)r.innerHTML=resultsHTML()});
}
function loadHome(){
  S.homeLoading=true;
  runSearch('').then(function(l){S.home=l;S.homeErr=''})
  .catch(function(e){S.homeErr=navigator.onLine?(e.message||'Try again in a moment.'):'You are offline.'})
  .then(function(){S.homeLoading=false;if(S.tab==='home')render()});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,d=el.dataset;
  if(a==='play'){playList(getList(d.list),+d.i)}
  else if(a==='tab'){S.tab=d.tab;S.openPl=null;render();$('#view').scrollTop=0}
  else if(a==='like'){e.stopPropagation();toggleLike(d.key)}
  else if(a==='dl'){e.stopPropagation();var t=S.reg.get(d.key);if(t)download(t)}
  else if(a==='add'){e.stopPropagation();addSheet(d.key)}
  else if(a==='open-player'){$('#player').classList.add('open')}
  else if(a==='close-player'){$('#player').classList.remove('open')}
  else if(a==='toggle'){e.stopPropagation();toggle()}
  else if(a==='next'){e.stopPropagation();next(false)}
  else if(a==='prev'){prev()}
  else if(a==='shuffle'){S.shuffle=!S.shuffle;renderPlayer()}
  else if(a==='repeat'){S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';renderPlayer()}
  else if(a==='queue'){S.showQueue=!S.showQueue;renderPlayer()}
  else if(a==='qplay'){playAt(+d.i)}
  else if(a==='qrm'){e.stopPropagation();var i=+d.i;S.queue.splice(i,1);if(i<S.idx)S.idx--;renderPlayer()}
  else if(a==='genre'){var q=$('#q');if(q)q.value=d.q;doSearch(d.q)}
  else if(a==='dlonly'){S.dlOnly=!S.dlOnly;render()}
  else if(a==='libtab'){S.libTab=d.t;S.openPl=null;render()}
  else if(a==='plcreate'){var p=createPlaylist('plname');if(p)render()}
  else if(a==='plopen'){S.openPl=d.id;render()}
  else if(a==='plback'){S.openPl=null;render()}
  else if(a==='plplay'){var l=getList('pl:'+S.openPl);if(l.length)playList(l,0);else toast('Add some songs first')}
  else if(a==='pldel'){S.playlists=S.playlists.filter(function(x){return x.id!==S.openPl});S.openPl=null;saveLib();render();toast('Playlist deleted')}
  else if(a==='settings'){settingsSheet()}
  else if(a==='close-sheet'){closeSheet()}
  else if(a==='source'){S.settings.source=d.v;LS.set('sg.settings',S.settings);settingsSheet();S.results=[];S.searched=false;loadHome();render()}
  else if(a==='install'){if(S.installEvt){S.installEvt.prompt();S.installEvt.userChoice.then(function(){S.installEvt=null;closeSheet();render()})}}
  else if(a==='qnext'||a==='qadd'){
    var tr=S.reg.get(d.key);if(!tr)return;
    if(!S.queue.length){playList([tr],0)}
    else if(a==='qnext')S.queue.splice(S.idx+1,0,tr);else S.queue.push(tr);
    closeSheet();toast(a==='qnext'?'Playing next':'Added to queue');renderPlayer();
  }
  else if(a==='pladd'){
    var pl=S.playlists.find(function(x){return x.id===d.id}),t2=S.reg.get(d.key);
    if(pl&&t2){if(pl.tracks.some(function(x){return x.key===t2.key}))toast('Already in '+pl.name);else{pl.tracks.push(t2);saveLib();toast('Added to '+pl.name)}}
    closeSheet();
  }
  else if(a==='plnew'){
    var np=createPlaylist('plname2'),t3=S.reg.get(d.key);
    if(np&&t3){np.tracks.push(t3);saveLib();closeSheet();toast('Added to '+np.name);if(S.tab==='library')render()}
  }
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}

  if(e.target.id==='q'){clearTimeout(searchTimer);var v=e.target.value;searchTimer=setTimeout(function(){doSearch(v)},400)}
  else if(e.target.id==='seek'){
    S.seeking=true;var d=audio.duration||0;var c=$('#tcur');if(c)c.textContent=fmt(e.target.value/1000*d);
  }
  else if(e.target.id==='jkey'){S.settings.jamendoKey=e.target.value;LS.set('sg.settings',S.settings)}
});
document.addEventListener('change',function(e){
  if(e.target.id==='seek'){var d=audio.duration||0;if(d)audio.currentTime=e.target.value/1000*d;S.seeking=false}
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEvt=e;if(S.tab==='home')render()});
window.addEventListener('appinstalled',function(){S.installEvt=null;toast('Installed. Find Sargam on your home screen.')});
function netState(){$('#offline').hidden=navigator.onLine}
window.addEventListener('online',function(){netState();loadHome()});
window.addEventListener('offline',netState);

/* ---------- boot ---------- */
render();renderPlayer();netState();
loadDownloads().then(function(){if(S.tab==='library')render()});
loadHome();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
